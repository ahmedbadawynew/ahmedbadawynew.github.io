<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>مصاريفي</title>
<meta charset="utf-8">
<meta name="theme-color" content="#0F1B2D">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F1B2D;--bg:#EEF2F6;--card:#fff;--mut:#6B7A90;--in:#0E9F8E;--out:#E4572E;--warn:#D99A00;--line:#DDE4EC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;padding-bottom:84px}
header{background:var(--ink);color:#fff;padding:22px 18px 26px;border-radius:0 0 22px 22px}
header small{opacity:.7;font-size:13px}
.big{font-size:38px;font-weight:800;margin:2px 0}
.sub{display:flex;gap:18px;font-size:13px;opacity:.85;flex-wrap:wrap}
main{padding:14px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);gap:8px}
.row:last-child{border:0}
.row .l{font-size:14px}.row .l small{display:block;color:var(--mut);font-size:12px}
.v{font-weight:700;white-space:nowrap}.in{color:var(--in)}.out{color:var(--out)}.warn{color:var(--warn)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
nav button{background:none;border:0;font:inherit;color:var(--mut);font-size:13px;padding:6px 10px}
nav button.on{color:var(--ink);font-weight:800}
nav .add{background:var(--ink);color:#fff;width:54px;height:54px;border-radius:50%;font-size:30px;margin-top:-26px;padding:0;line-height:1}
.sheet{position:fixed;inset:0;background:rgba(15,27,45,.55);display:flex;align-items:flex-end;z-index:9}
.sheet>div{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
.x{display:block;margin:0 0 6px auto;margin-inline-start:0;background:var(--bg);border:0;border-radius:50%;width:38px;height:38px;font-size:18px;color:var(--ink)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13px}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--in);color:#fff;font:inherit;font-weight:800;font-size:16px;margin-top:16px}
.btn.d{background:#fff;color:var(--out);border:1px solid var(--out);margin-top:8px}
.pay{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:6px 12px;font:inherit;font-size:13px}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--bg);color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:24px 0;font-size:14px}
#lock{position:fixed;inset:0;background:var(--ink);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.lk{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:380px}.lk h2{margin:0 0 4px}.lk .chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px}.lk .chk input{width:auto}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:30px;font-size:14px;display:none;z-index:99}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:8px 0}
.cal .wh{text-align:center;font-size:11px;color:var(--mut)}
.cd{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:700;line-height:1.1}
.cd small{font-size:9px;font-weight:400;min-height:10px}
.cd.du{border:2px solid var(--ink)}.cd.late{border:2px solid var(--out);color:var(--out)}.cd.pd{background:var(--in);color:#fff;border-color:var(--in)}
.cd.sk{background:#e6eaf0;color:var(--mut);text-decoration:line-through}.cd.mv{border:2px dashed var(--warn);color:var(--warn)}.cd.ex{border-style:dashed}.cd.td{box-shadow:0 0 0 2px var(--warn)}
.calnav{display:flex;justify-content:space-between;align-items:center;margin:6px 0}.calnav button{background:var(--bg);border:0;border-radius:10px;width:44px;height:38px;font-size:20px}
.legend{font-size:11px;color:var(--mut);margin:4px 0 8px;line-height:1.8}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink)}.chk input{width:auto}
#undo{position:fixed;bottom:92px;left:12px;right:12px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;display:none;justify-content:space-between;align-items:center;z-index:40}#undo button{background:none;border:0;color:#7ee0d3;font:inherit;font-weight:800}
@media print{nav,.noprint,#toast,#undo{display:none!important}body{padding:0;background:#fff}header{border-radius:0}}
@page{size:A4;margin:8mm}
.a4{width:733px;background:#fff;color:#0F1B2D;font-size:11px;line-height:1.45;direction:rtl;font-family:Tajawal,system-ui,sans-serif;padding-bottom:10px}
.a4 *{box-sizing:border-box}
.a4 .hd{background:#0F1B2D;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.a4 .hd b{font-size:22px;display:block}.a4 .hd small{opacity:.75;font-size:10px}
.a4 .kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 14px 0}
.a4 .kp>div{border:1px solid #DDE4EC;border-radius:10px;padding:7px 10px}.a4 .kp small{color:#6B7A90;font-size:10px;display:block}.a4 .kp b{font-size:17px}
.a4 .sl{padding:5px 18px 0;color:#6B7A90;font-size:10px}
.a4 .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 14px 0}
.a4 .g1{padding:10px 14px 0}
.a4 .bx{border:1px solid #DDE4EC;border-radius:10px;padding:8px 10px}
.a4 .bx h4{margin:0 0 6px;font-size:12px;border-bottom:2px solid #0E9F8E;display:inline-block;padding-bottom:1px}
.a4 table{width:100%;border-collapse:collapse}
.a4 td,.a4 th{padding:3px 2px;border-bottom:1px solid #EEF2F6;text-align:right;font-weight:400}
.a4 th{color:#6B7A90;font-size:10px}.a4 .n{text-align:left!important;white-space:nowrap}
.a4 .in{color:#0E9F8E}.a4 .out{color:#E4572E}.a4 .mut{color:#6B7A90}
.a4 .trk{background:#EEF2F6;border-radius:4px;display:block;height:7px}.a4 .bar{background:#E4572E;border-radius:4px;display:block;height:7px}
.a4 ul{margin:0;padding:0 16px 0 0}.a4 li{margin:1px 0}
.a4 .ft{padding:8px 18px 0;color:#6B7A90;font-size:9.5px;display:flex;justify-content:space-between}
@media print{header,nav,.noprint{display:none!important}body{padding:0!important;background:#fff!important}main{padding:0!important}#rpwrap{height:auto!important;width:auto!important}#rpwrap .a4{transform:none!important;zoom:var(--pz,1)}}
header.stk{position:sticky;top:0;z-index:20;padding:12px 18px 14px;box-shadow:0 4px 14px rgba(15,27,45,.25)}header.stk small{font-size:12px}header.stk .big{font-size:30px;margin:0;line-height:1.25}header.stk .sub{font-size:12.5px;gap:14px;margin-top:2px}
.bd-t{display:block;height:8px;background:var(--bg);border-radius:5px;overflow:hidden;margin:6px 0 3px}.bd-t span{display:block;height:100%;border-radius:5px}
details.dt>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:9px 0;cursor:pointer;font-size:14px}
details.dt>summary::-webkit-details-marker{display:none}
details.dt>summary>b{margin-inline-start:auto}
details.dt>summary::after{content:'‹';color:var(--mut);font-size:18px;transition:transform .2s}
details.dt[open]>summary::after{transform:rotate(-90deg)}
details.card.dt{padding:4px 14px}
.row.sub{padding-inline-start:12px;font-size:13px}
.qr{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.qr::-webkit-scrollbar{display:none}
.qr button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:20px;padding:9px 14px;font:inherit;font-size:13px;white-space:nowrap;color:var(--ink)}
.tl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.tl button{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 8px;font:inherit;font-size:14px;line-height:1.4;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}
.tl button span{font-size:26px}
h3.sec{margin:16px 4px 8px;font-size:13px;color:var(--mut);font-weight:500}
</style>
</head>
<body>
<div id="toast"></div>
<div id="app"></div>
<nav id="nav"></nav>
<div id="modal"></div>
<div id="lock"></div>
<div id="cf"></div>
<div id="undo"></div>
<script>
let API=(()=>{try{return localStorage.getItem('api')||''}catch(e){return ''}})();
async function api(fn,args){
  const r=await fetch(API,{method:'POST',body:JSON.stringify({fn,args}),redirect:'follow'});
  const j=await r.json();
  if(!j.ok)throw new Error(j.error);
  return j.data;
}
const google={script:{run:(function make(ok,fail){return new Proxy({},{get:(_,k)=>k==='withSuccessHandler'?s=>make(s,fail):k==='withFailureHandler'?x=>make(ok,x):(...a)=>{api(k,a).then(r=>ok&&ok(r)).catch(e=>{if(fail)fail(e);else console.error(e)})}})})()}};
</script>
<script>
const $=s=>document.querySelector(s);
const f=n=>{n=Math.round((+n||0)*100)/100;if(n===0)n=0;return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})};
const fc=n=>n%1?f(n):Math.round(n).toLocaleString('en-US');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const ym=d=>String(d).slice(0,7);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const EXP=['أكل وشرب','سوبرماركت','مواصلات','بنزين','صحة','ترفيه','ملابس','فواتير','دروس','أخرى'];
const INC=['راتب','إضافي','حوافز','أخرى'];
const TYPES=[['expense','مصروف'],['income','إيراد'],['visa_pay','إيداع فيزا'],['transfer','تحويل']];
const TL={expense:'مصروف',income:'إيراد',visa_pay:'إيداع فيزا',transfer:'تحويل'};
let D={tx:[],acc:[],ob:[],occ:[],rd:[],bl:[],cfg:{},users:[],me:null},tab='home',busy=false,TOKEN=null;

let _tt=null,_bchk=null;
function toast(m,ms){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(_tt);_tt=setTimeout(()=>t.style.display='none',ms||1800)}
function call(fn,...a){
  busy=true;toast('جاري الحفظ…');
  google.script.run.withSuccessHandler(r=>{D=r;busy=false;toast('تم');closeSheet();render();if(_bchk){const k=_bchk;_bchk=null;setTimeout(()=>budgetToast(k),700)}})
    .withFailureHandler(e=>{busy=false;if(/AUTH/.test(e.message))return lockScreen('login');toast('حصل خطأ: '+e.message)})[fn](TOKEN,...a);
}
function load(){google.script.run.withSuccessHandler(r=>{D=r;render()}).withFailureHandler(e=>{if(/AUTH/.test(e.message))return lockScreen('login');$('#app').innerHTML='<div class="empty">تعذر تحميل البيانات: '+esc(e.message)+'</div>'}).getAll(TOKEN)}
const accName=id=>(D.acc.find(a=>a.id===id)||{name:'—'}).name;
const kind=id=>(D.acc.find(a=>a.id===id)||{}).kind;

function calc(){
  D.occ=D.occ||[];D.rd=D.rd||[];D.bl=D.bl||[];D.cfg=D.cfg||{};
  const cm=ym(todayStr()),day=+todayStr().slice(8);
  const bal={};D.acc.forEach(a=>bal[a.id]=a.kind==='visa'?0:a.opening);
  let vOpen=0,vLimit=0,vBefore=0,vCur=0,vPaid=0,inc=0,exp=0;
  D.acc.filter(a=>a.kind==='visa').forEach(a=>{vOpen+=a.opening;vLimit+=a.limit});
  D.tx.forEach(t=>{const a=t.amount,m=ym(t.date)===cm;
    if(t.type==='income'){if(t.account in bal)bal[t.account]+=a;if(m)inc+=a}
    else if(t.type==='expense'){
      if(kind(t.account)==='visa'){ym(t.date)<cm?vBefore+=a:vCur+=a}else if(t.account in bal)bal[t.account]-=a;
      if(m)exp+=a}
    else if(t.type==='visa_pay'){if(t.account in bal)bal[t.account]-=a;vPaid+=a}
    else if(t.type==='transfer'){if(t.account in bal)bal[t.account]-=a;if(t.to in bal)bal[t.to]+=a}
  });
  const total=vOpen+vBefore+vCur-vPaid;
  const due=Math.min(total,Math.max(0,vOpen+vBefore-vPaid)),cur=total-due;
  const cash=D.acc.filter(a=>a.kind==='cash').reduce((s,a)=>s+bal[a.id],0);
  const bank=D.acc.filter(a=>a.kind==='bank').reduce((s,a)=>s+bal[a.id],0);
  const obs=D.ob.filter(o=>o.active!=='no'&&!o.weekdays&&(!o.startYm||o.startYm<=cm)&&(!o.endYm||o.endYm>=cm)).map(o=>{
    const paid=D.tx.some(t=>t.obId===o.id&&t.ym===cm);
    return {...o,total:o.amount*(o.times||1),paid,late:!paid&&o.day<day}});
  const occs=D.ob.filter(o=>o.active!=='no'&&o.weekdays).flatMap(o=>obMonth(o,cm));
  const sess=D.ob.filter(o=>o.active!=='no'&&o.weekdays&&o.pkg>0).map(o=>{const pb=pkgBlocks(o);return {ob:o,held:pb.held,blocks:pb.blocks,partial:pb.partial}});
  const unpaid=obs.filter(o=>!o.paid).reduce((s,o)=>s+o.total,0)+occs.filter(i=>i.state==='due'&&!i.ob.pkg).reduce((s,i)=>s+i.amount,0)+sess.reduce((s,x)=>s+x.blocks.filter(b=>b.month<=cm).reduce((a,b)=>a+b.price,0),0);
  return {bal,cash,bank,total,due,cur,vLimit,credit:vLimit-total,obs,occs,sess,unpaid,inc,exp,cm,day,
    free:cash+bank-due-unpaid,net:cash+bank-total-unpaid};
}

function render(){
  const c=calc();
  if(D.me&&D.me.role==='user')return renderLite(c);
  $('#nav').innerHTML=[['home','🏠','الرئيسية'],['tx','📒','الحركات'],['add','+',''],['ob','📅','الالتزامات'],['mr','☰','المزيد']]
   .map(([k,i,l])=>k==='add'?'<button class="add" onclick="openTx()">+</button>':`<button class="${tab===k||(k==='mr'&&['acc','st','rp','bd','mt'].includes(tab))?'on':''}" onclick="tab='${k}';render()">${i}<br>${l}</button>`).join('');
  $('#app').innerHTML=({home,tx:txView,ob:obView,acc:accView,st:stView,mt:mtView,rp:rpView,bd:bdView,mr:moreView})[tab](c);if(tab==='rp')rpFit();
}

function home(c){
  const lateDue=c.due>0&&c.day>27,hasVisa=D.acc.some(a=>a.kind==='visa'),cashAcc=D.acc.filter(a=>a.kind==='cash');
  const need=todayRows(c)+sessRows(c)+meterRows(c)+budgetRows(c)+visaRow(c);
  const monthly=c.obs.filter(o=>!o.paid).map(o=>`<div class="row sub"><span class="l">${esc(o.name)}<small class="${o.late?'out':''}">يوم ${o.day}${o.late?' • عدّى ميعاده':''}</small></span><span class="v warn">${f(o.total)}</span></div>`).join('')+wkRows(c).replace(/class="row"/g,'class="row sub"');
  return `<header class="stk"><small>موقفي الصافي <span style="opacity:.8">(كاش + بنك − كل الفيزا − الالتزامات)</span></small>
   <div class="big" style="${c.net<0?'color:#ff9d80':''}">${f(c.net)} ج</div>
   <div class="sub"><span>المتاح للصرف: <b>${f(c.free)}</b></span><span>إيراد: ${f(c.inc)}</span><span>مصروف: ${f(c.exp)}</span></div></header>
  <main>
   ${quickRow()}
   ${need?`<div class="card" style="border:2px solid var(--warn)"><h3>🔔 المطلوب دلوقتي</h3>${need}</div>`:''}
   <div class="card"><h3>فلوسي</h3>
    <details class="dt"><summary><span>💵 كاش</span><b>${f(c.cash)}</b></summary>${cashAcc.map(a=>`<div class="row sub"><span class="l">${esc(a.name)}</span><span class="v" style="font-weight:400">${f(c.bal[a.id])}</span></div>`).join('')||'<div class="row sub"><span class="l">مفيش أماكن كاش</span></div>'}</details>
    <div class="row"><span class="l">🏦 البنك</span><span class="v">${f(c.bank)}</span></div>
    ${hasVisa?`<details class="dt"><summary><span>💳 الفيزا (المديونية)</span><b class="${c.due>0?'out':''}">${f(c.total)}</b></summary>
     <div class="row sub"><span class="l">عليا أدفعه قبل 27 ${lateDue?'<small class="out">متأخر</small>':'<small>مشتريات الشهور اللي فاتت</small>'}</span><span class="v ${c.due>0?'out':'in'}">${f(c.due)}</span></div>
     <div class="row sub"><span class="l">مشتريات الشهر الحالي<small>تتدفع قبل 27 الشهر الجاي</small></span><span class="v">${f(c.cur)}</span></div>
     <div class="row sub"><span class="l">الحد المتاح<small>من ${f(c.vLimit)}</small></span><span class="v">${f(c.credit)}</span></div></details>`:''}</div>
   ${monthly?`<details class="card dt"><summary><span>🗓 التزامات لسه الشهر ده</span><b class="warn">${f(c.unpaid)}</b></summary>${monthly}</details>`
    :`<div class="card"><div class="row"><span class="l">🗓 التزامات الشهر</span><span class="v in">كله اتدفع ✔</span></div></div>`}
  </main>`;
}

let TF={q:'',type:'all',acc:'all',cat:'all',range:'all',from:'',to:'',lim:60,open:false};
const nrm=s=>String(s==null?'':s).toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي');
function rangeFor(k,fr,to){
  const mo=todayStr().slice(0,7);
  if(k==='month')return [mo+'-01',mo+'-31'];
  if(k==='prev'){let [y,m]=mo.split('-').map(Number);m--;if(m<1){m=12;y--}const p=y+'-'+pad(m);return [p+'-01',p+'-31']}
  if(k==='custom')return [fr||'0000-00-00',to||'9999-99-99'];
  return ['0000-00-00','9999-99-99'];
}
function txFilter(){
  const [a,b]=rangeFor(TF.range,TF.from,TF.to),ws=nrm(TF.q.trim()).split(/\s+/).filter(Boolean);
  return D.tx.filter(t=>{
    if(t.date<a||t.date>b)return false;
    if(TF.type!=='all'&&t.type!==TF.type)return false;
    if(TF.acc!=='all'&&t.account!==TF.acc&&t.to!==TF.acc)return false;
    if(TF.cat!=='all'&&t.category!==TF.cat)return false;
    if(ws.length){const hay=nrm([t.category,t.sub,t.note,t.via,t.by,accName(t.account),t.to?accName(t.to):'',t.amount,TL[t.type]].join(' '));if(!ws.every(w=>hay.includes(w)))return false}
    return true;
  }).sort((x,y)=>y.date.localeCompare(x.date)||y.id.localeCompare(x.id));
}
function txRow(t){
  const s=t.type==='income'?'+':t.type==='expense'?'−':'',cl=t.type==='income'?'in':t.type==='expense'?'out':'';
  const w=t.type==='transfer'||t.type==='visa_pay'?accName(t.account)+' ← '+accName(t.to):accName(t.account);
  return `<div class="row" onclick="openTxSheet('${t.id}')"><span class="l">${esc(t.category||TL[t.type])}${t.sub?' › '+esc(t.sub):''}<small>${t.date} • ${esc(w)}${t.via?' • '+esc(t.via):''}${t.note?' • '+esc(t.note):''}${t.by&&D.users&&D.users.length>1?' • 👤'+esc(t.by):''}</small></span><span class="v ${cl}">${s}${f(t.amount)}</span></div>`;
}
function txListHtml(){
  const L=txFilter(),sh=L.slice(0,TF.lim),inc=L.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0),exp=L.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);

/* ---------- الالتزامات الأسبوعية: الأيام (Occurrences) ---------- */
function sched(ob,d){
  const wd=String(ob.weekdays||'').split(',').filter(x=>x!=='').map(Number);
  return wd.includes(wdOf(d))&&(!ob.startYm||ym(d)>=ob.startYm)&&(!ob.startDate||d>=ob.startDate)&&(!ob.endYm||ym(d)<=ob.endYm);
}
function itemFor(ob,d){
  const o=D.occ.find(x=>x.id===ob.id+'_'+d),s=sched(ob,d);
  if(!s&&(!o||o.status==='skip'))return null;
  const eff=(o&&o.newDate)||d,paid=!!(o&&o.status==='paid'&&D.tx.some(t=>t.id===o.txId));
  return {key:ob.id+'_'+d,ob,orig:d,date:eff,amount:o&&o.amount>0?o.amount:ob.amount,
    state:o&&o.status==='skip'?'skip':paid?'paid':'due',moved:eff!==d,extra:!s};
}
function obMonth(ob,mo){
  const cs=new Set(),n=daysIn(mo),out=[];
  for(let i=1;i<=n;i++){const d=mo+'-'+pad(i);if(sched(ob,d))cs.add(d)}
  D.occ.filter(o=>o.obId===ob.id).forEach(o=>cs.add(o.date));

const occRec=(it,st,nd,amt,tx)=>({id:it.key,obId:it.ob.id,date:it.orig,status:st,newDate:nd||'',amount:amt||'',txId:tx||''});

/* ---------- كشف الحساب ---------- */
let ST={acc:'all',range:'month',from:'',to:''};
function openSt(id){ST.acc=id||'all';tab='st';render();window.scrollTo(0,0)}
function stRange(){
  const td=todayStr(),mo=td.slice(0,7);
  if(ST.range==='month')return [mo+'-01',mo+'-31'];
  if(ST.range==='prev'){let [y,m]=mo.split('-').map(Number);m--;if(m<1){m=12;y--}const p=y+'-'+pad(m);return [p+'-01',p+'-31']}
  if(ST.range==='all')return ['0000-00-00','9999-99-99'];
  return [ST.from||'0000-00-00',ST.to||'9999-99-99'];
}
function ledger(){
  const bal={};D.acc.forEach(a=>bal[a.id]=a.opening||0);
  const liqIds=D.acc.filter(a=>a.kind!=='visa').map(a=>a.id),liq=()=>liqIds.reduce((s,i)=>s+bal[i],0),liq0=liq();
  const list=D.tx.map((t,i)=>({t,i})).sort((a,b)=>a.t.date.localeCompare(b.t.date)||a.i-b.i),out=[];
  list.forEach(({t})=>{
    const a=t.amount,eff=[],add=(id,d)=>{if(!(id in bal))return;bal[id]+=d;eff.push({id,d,after:bal[id]})};
    if(t.type==='income')add(t.account,a);
    else if(t.type==='expense')add(t.account,kind(t.account)==='visa'?a:-a);
    else if(t.type==='visa_pay'){add(t.account,-a);add(t.to,-a)}
    else if(t.type==='transfer'){add(t.account,-a);add(t.to,a)}
    out.push({t,eff,liq:liq()});
  });
  return {out,liq0};
}
const stDesc=t=>t.type==='income'?(t.category||'إيراد')+(t.via?' • '+t.via:''):t.type==='expense'?(t.category||'مصروف')+(t.sub?' › '+t.sub:''):t.type==='visa_pay'?'إيداع فيزا':'تحويل بين حسابات';
const stCp=t=>t.type==='visa_pay'||t.type==='transfer'?accName(t.account)+' ← '+accName(t.to):accName(t.account);
function stData(){
  const L=ledger(),[fr,to]=stRange(),all=ST.acc==='all';
  const A=all?null:D.acc.find(a=>a.id===ST.acc);if(!all&&!A){ST.acc='all';return stData()}
  let es,start;
  if(all){let prev=L.liq0;es=L.out.map(e=>{const r={t:e.t,amt:e.liq-prev,bal:e.liq,note:e.eff.map(x=>accName(x.id)+': '+f(x.after)).join(' • ')};prev=e.liq;return r});start=L.liq0}
  else{es=L.out.filter(e=>e.eff.some(x=>x.id===A.id)).map(e=>{const x=e.eff.find(y=>y.id===A.id);return {t:e.t,amt:x.d,bal:x.after,note:''}});start=A.opening||0}
  const bef=es.filter(r=>r.t.date<fr),open=bef.length?bef[bef.length-1].bal:start;
  const rows=es.filter(r=>r.t.date>=fr&&r.t.date<=to),close=rows.length?rows[rows.length-1].bal:open;
  const inT=rows.filter(r=>r.amt>0).reduce((s,r)=>s+r.amt,0),outT=rows.filter(r=>r.amt<0).reduce((s,r)=>s-r.amt,0);
  return {all,A,open,close,rows,inT,outT,cur:es.length?es[es.length-1].bal:start};
}
function stView(){
  const d=stData(),vs=!d.all&&d.A.kind==='visa',nm=d.all?'كل الحسابات':d.A.name;
  const rg=[['month','الشهر ده'],['prev','الشهر اللي فات'],['all','الكل'],['custom','مخصص']];

  return `<header><small class="noprint" onclick="tab='mr';render()" style="cursor:pointer">→ رجوع للمزيد</small>
   <div class="big" style="font-size:24px">كشف حساب: ${esc(nm)}</div>
   <div class="sub"><span>${vs?'المديونية الحالية':d.all?'السيولة الحالية (كاش + بنك)':'الرصيد الحالي'}: ${f(d.cur)} ج</span></div></header><main>
   <div class="card noprint"><label style="margin-top:0">الحساب</label>

function cost(m,c){
  const T=tar(m),p=T.prices,fe=T.fees;let e=0,t=1;
  if(c>0){
    if(T.model==='elec'){
      if(c<=50){e=c*p[0];t=1}
      else if(c<=100){e=50*p[0]+(c-50)*p[1];t=2}
      else if(c<=200){e=c*p[2];t=3}
      else if(c<=350){e=200*p[2]+(c-200)*p[3];t=4}
      else if(c<=650){e=200*p[2]+150*p[3]+(c-350)*p[4];t=5}
      else if(c<=1000){e=200*p[2]+150*p[3]+300*p[4]+(c-650)*p[5];t=6}

      const b=T.bounds;e=Math.min(c,b[0])*p[0]+Math.max(0,Math.min(c,b[1])-b[0])*p[1]+Math.max(0,c-b[1])*p[2];t=c<=b[0]?1:c<=b[1]?2:3;

function rpFit(){

function loadJs(u){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=()=>no(new Error('محتاج إنترنت عشان يجهّز الـ PDF'));document.head.appendChild(s)})}
async function rpPdf(){
  try{
    toast('جاري تجهيز الـ PDF…');
    if(!window.html2canvas)await loadJs('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(!window.jspdf)await loadJs('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const host=document.createElement('div');host.style.cssText='position:fixed;left:-10000px;top:0;width:733px;background:#fff';host.innerHTML=rpHtml(RP.m);document.body.appendChild(host);
    const cv=await html2canvas(host.querySelector('.a4'),{scale:2,backgroundColor:'#ffffff',useCORS:true});host.remove();
    const {jsPDF}=window.jspdf,pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'}),pw=210,ph=297,mg=6;
    let w=pw-2*mg,hh=w*cv.height/cv.width;if(hh>ph-2*mg){hh=ph-2*mg;w=hh*cv.width/cv.height}
    pdf.addImage(cv.toDataURL('image/jpeg',0.95),'JPEG',(pw-w)/2,mg,w,hh);
    const blob=pdf.output('blob'),name='تقرير-'+RP.m+'.pdf',file=new File([blob],name,{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e.name==='AbortError')return}}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('اتنزّل الملف');
  }catch(e){toast(e.message||'حصل خطأ في تجهيز الـ PDF')}
}

/* ---------- دروس بالباقة: حصص بتتراكم ودفع بعدد حصص ---------- */
let PK={};
function pkgList(o){const s=String(o.pkgs||'');if(s)return s.split(';').map(x=>{const q=x.split(':');return {n:parseFloat(q[0]),p:parseFloat(q[1])}}).filter(k=>k.n>0&&k.p>0);return o.pkg>0?[{n:o.pkg,p:o.pkgPrice}]:[]}
function pkgPrice(ob,n){
  const L=pkgList(ob);if(!L.length)return Math.round(perOf(ob)*n*100)/100;
  const best=[0];for(let i=1;i<=n;i++){best[i]=Infinity;L.forEach(k=>{if(k.n<=i&&best[i-k.n]+k.p<best[i])best[i]=best[i-k.n]+k.p})}
  return isFinite(best[n])?Math.round(best[n]*100)/100:Math.round(perOf(ob)*n*100)/100;
}
const perOf=ob=>ob.pkg>0?Math.round(ob.pkgPrice/ob.pkg*100)/100:ob.amount;
function sessWin(ob){
  const cm=todayStr().slice(0,7);let out=[];
  for(let k=-12;k<=4;k++){let [y,m]=cm.split('-').map(Number);m+=k;while(m<1){m+=12;y--}while(m>12){m-=12;y++}out=out.concat(obMonth(ob,y+'-'+pad(m)))}
  return out.filter(i=>i.state==='due').sort((a,b)=>a.date.localeCompare(b.date)||a.key.localeCompare(b.key));
}
/* الباقة = كتلة حصص بالتتابع (مش بتتقطع بآخر الشهر). الكتلة بتتحسب في شهر آخر حصة فيها */
function pkgBlocks(ob){
  const w=sessWin(ob),N=ob.pkg,td=todayStr(),blocks=[];
  for(let i=0;i+N<=w.length;i+=N){const s=w.slice(i,i+N);blocks.push({items:s,first:s[0].date,last:s[N-1].date,month:ym(s[N-1].date),price:ob.pkgPrice,done:s[N-1].date<=td})}
  return {blocks,partial:w.slice(Math.floor(w.length/N)*N),held:w.filter(i=>i.date<=td)};
}
function blockInfo(ob,it){
  const w=sessWin(ob),i=w.findIndex(x=>x.key===it.key),N=ob.pkg;
  if(i<0)return '<div class="row"><span class="l">حصة ضمن باقات الدروس</span></div>';
  const bI=Math.floor(i/N),full=(bI+1)*N<=w.length,last=w[Math.min((bI+1)*N,w.length)-1];
  return `<div class="row"><span class="l">حصة ${i%N+1} من ${N}<small>${full?'الباقة بتخلص '+fd(last.date)+' وبتتحسب في '+MN[+ym(last.date).slice(5)-1]:'الباقة دي لسه ماكملتش حصصها'} • الدفع وقت ما تحب</small></span></div>`;
}
function sessRows(c){
  return (c.sess||[]).filter(s=>s.held.length>0).map(s=>{const ob=s.ob,n=s.held.length,full=Math.floor(n/ob.pkg),cur=n%ob.pkg;
    return `<div class="row"><span class="l" onclick="openCal('${ob.id}')">📚 ${esc(ob.name)}<small class="${full?'out':''}">${full?full+' باقة كملت ('+full*ob.pkg+' حصة)':''}${full&&cur?' + ':''}${cur?cur+' من '+ob.pkg+' في الباقة الجاية':''}</small></span><span class="v">${full?f(full*ob.pkgPrice)+' ':''}<button class="pay" onclick="openPkg('${ob.id}')">ادفع</button></span></div>`}).join('');
}
function openPkg(id){
  const ob=D.ob.find(x=>x.id===id),td=todayStr(),held=sessWin(ob).filter(i=>i.date<=td).length,per=perOf(ob);
  PK={id,per,manual:false};
  const k0=held>=ob.pkg?Math.floor(held/ob.pkg)*ob.pkg:ob.pkg,pl=pkgList(ob);
  sheet(`<h3>📚 ${esc(ob.name)} — دفع حصص</h3>
   <div class="row"><span class="l">حصص خدتها ومادفعتش عنها<small>الباقات: ${pkgList(ob).map(k=>k.n+' = '+f(k.p)).join(' • ')}</small></span><span class="v ${held>=ob.pkg?'out':''}">${held}</span></div>
   <label>عدد الحصص اللي هتدفع عنها</label>
   <div class="seg">${pl.map(k=>`<button onclick="pkSet(${k.n})">${k.n} حصة • ${f(k.p)}</button>`).join('')}${held>0&&!pl.some(k=>k.n===held)?`<button onclick="pkSet(${held})">كل المتراكم (${held})</button>`:''}</div>
   <input id="k_n" type="number" inputmode="numeric" value="${k0}" oninput="pkCalc()" style="margin-top:8px">
   <label>المبلغ (بيتحسب لوحده وتقدر تعدّله)</label><input id="k_amt" type="number" step="any" inputmode="decimal" value="${pkgPrice(ob,k0)}" oninput="PK.manual=true">
   <label>الدفع من</label><select id="k_acc">${opts(D.acc.map(a=>[a.id,a.name]),defAcc(ob))}</select>
   <div id="k_pv" style="margin-top:10px;font-size:13px;color:var(--mut);line-height:1.7"></div>
   <button class="btn" onclick="payPkg()">✔ اتدفع (نزّله مصروف)</button>`);

function pkSet(n){$('#k_n').value=n;PK.manual=false;pkCalc()}
function pkCalc(){

}

  const L=quickList();
  if(!edit&&!L.length)return '';
  return `<div class="card"><h3 style="display:flex;justify-content:space-between;align-items:center">⚡ مصروف سريع${edit?`<span onclick="openQuick()" style="font-size:12px;color:var(--mut);font-weight:500;cursor:pointer">${L.length?'⚙ تعديل':'+ ضيف قالب'}</span>`:''}</h3>
   ${L.length?`<div class="seg">${L.map(q=>`<button onclick="quickAdd('${q.id}')">${esc(q.n)}${q.a>0?' • '+fu(q.a):''}</button>`).join('')}</div>`:'<div style="color:var(--mut);font-size:13px;line-height:1.7">اعمل قوالب للمصروفات المتكررة (قهوة، بنزين…) وسجّلها بضغطة واحدة من غير كتابة.</div>'}</div>`;
}
function quickAdd(id){
  const q=quickList().find(x=>x.id===id);if(!q)return;
  if(!D.acc.some(a=>a.id===q.acc)){toast('الحساب بتاع القالب ده مش موجود. عدّله الأول');if(!(D.me&&D.me.role==='user'))openQuick();return}
  if(!(q.a>0))return askAmt(q);
  quickSave(q,q.a);
}
function askAmt(q){
  sheet(`<h3>⚡ ${esc(q.n)}</h3><label>المبلغ</label><input id="qa_v" type="number" step="any" inputmode="decimal">
   <button class="btn" onclick="quickSave(quickList().find(x=>x.id==='${q.id}'),parseFloat(val('qa_v')))">سجّل</button>`);
  setTimeout(()=>{const e=$('#qa_v');if(e&&e.focus)e.focus()},200);
}
function quickSave(q,a){
  if(!q||!(a>0))return toast('اكتب المبلغ');
  const td=todayStr(),tx={id:uid(),date:td,type:'expense',amount:a,account:q.acc,to:'',category:q.c||'',sub:q.s||'',via:'',note:q.n,obId:'',ym:ym(td)};
  RET=null;
  chain([['upsert','Tx',tx]],()=>{undoAdd(tx,q.n);if(q.c)budgetToast({cat:q.c,date:td,a})});
}
function undoAdd(tx,n){
  clearTimeout(_ut);_ud=['__del','Tx',tx.id];const u=$('#undo');
  u.innerHTML=`<span>✔ ${esc(n)} ${f(tx.amount)}</span><button onclick="doUndo()">↩ تراجع</button>`;u.style.display='flex';
  _ut=setTimeout(()=>u.style.display='none',9000);
}
function saveQuick(arr){RET=openQuick;chain([['upsert','Settings',{id:'quick',json:JSON.stringify(arr)}]])}
function openQuick(){
  RET=null;const L=quickList();
  sheet(`<h3>⚡ قوالب المصروف السريع</h3><small style="color:var(--mut);display:block;line-height:1.7">زرار لكل مصروف بتكرره (قهوة 30، بنزين 400…). ضغطة واحدة وبيتسجل بتاريخ النهارده، وبتلاقي "تراجع" لو دوست بالغلط.</small>
   ${L.map(q=>`<div class="row" onclick="openQf('${q.id}')"><span class="l">${esc(q.n)}<small>${q.a>0?f(q.a):'مبلغ متغير'} • ${esc(q.c||'من غير بند')}${q.s?' › '+esc(q.s):''} • ${esc(accName(q.acc))}</small></span><span class="v">‹</span></div>`).join('')||'<div class="empty">لسه مفيش قوالب</div>'}
   <button class="btn" onclick="openQf()">+ قالب جديد</button>`);
}
function openQf(id){
  const q=quickList().find(x=>x.id===id);
  QF=q?{...q,isNew:false}:{id:uid(),n:'',a:'',c:catNames()[0]||'',s:'',acc:(D.acc.find(a=>a.kind==='cash')||D.acc[0]||{}).id,isNew:true};
  qfForm();
}
function qfKeep(){const g=id=>$('#'+id);if(g('qf_n'))QF.n=g('qf_n').value.trim();if(g('qf_a'))QF.a=g('qf_a').value;if(g('qf_c'))QF.c=g('qf_c').value;if(g('qf_s'))QF.s=g('qf_s').value;if(g('qf_acc'))QF.acc=g('qf_acc').value}
function qfCat(){qfKeep();QF.s='';qfForm()}
function qfForm(){
  RET=openQuick;
  sheet(`<h3>${QF.isNew?'قالب جديد':'تعديل القالب'}</h3>
   <label>الاسم (اللي هيظهر على الزرار)</label><input id="qf_n" value="${esc(QF.n)}" placeholder="قهوة">
   <label>المبلغ (سيبه فاضي لو بيتغيّر، وهيسألك كل مرة)</label><input id="qf_a" type="number" step="any" inputmode="decimal" value="${QF.a||''}">
   <label>البند</label><select id="qf_c" onchange="qfCat()">${opts(catOpts(QF.c),QF.c)}</select>
   ${subOpts(QF.c,QF.s).length?`<label>البند الفرعي (اختياري)</label><select id="qf_s">${opts([['','— من غير —'],...subOpts(QF.c,QF.s).map(x=>[x,x])],QF.s||'')}</select>`:''}
   <label>الدفع من</label><select id="qf_acc">${opts(D.acc.map(a=>[a.id,a.name]),QF.acc)}</select>
   <button class="btn" onclick="qfSave()">حفظ</button>${QF.isNew?'':'<button class="btn d" onclick="qfDel()">حذف القالب</button>'}`);
}
function qfSave(){
  qfKeep();if(!QF.n)return toast('اكتب الاسم');if(!QF.acc)return toast('اختار حساب');
  const it={id:QF.id,n:QF.n,a:parseFloat(QF.a)||0,c:QF.c||'',s:QF.s||'',acc:QF.acc},old=quickList();
  saveQuick(old.some(x=>x.id===QF.id)?old.map(x=>x.id===QF.id?it:x):[...old,it]);
}
function qfDel(){askConfirm('حذف القالب؟',`<b>${esc(QF.n)}</b> هيتشال من الزراير. الحركات اللي اتسجلت بيه بتفضل.`,'نعم، احذف',()=>saveQuick(quickList().filter(x=>x.id!==QF.id)))}

function openAcc(id){
  const a=D.acc.find(x=>x.id===id)||{id:uid(),name:'',kind:'cash',opening:0,limit:0};
  sheet(`<h3>${id?'تعديل حساب':'حساب جديد'}</h3>
   <label>الاسم</label><input id="a_name" value="${esc(a.name)}" placeholder="مثلاً: كاش الدرج">
   <label>النوع</label><select id="a_kind">${opts([['cash','كاش'],['bank','بنك'],['visa','فيزا ائتمانية']],a.kind)}</select>
   <label>الرصيد الافتتاحي (للفيزا: المديونية الحالية)</label><input id="a_open" type="number" step="any" inputmode="decimal" value="${a.opening||''}">
   <label>الحد الائتماني (للفيزا فقط)</label><input id="a_limit" type="number" step="any" inputmode="decimal" value="${a.limit||''}">
   <button class="btn" onclick="call('upsert','Accounts',{id:'${a.id}',name:val('a_name'),kind:val('a_kind'),opening:parseFloat(val('a_open'))||0,limit:parseFloat(val('a_limit'))||0})">حفظ</button>
   ${id?`<button class="btn d" onclick="delAcc('${id}')">حذف</button>`:''}`);
}
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
function boot(){
  if(!API)return askApi();
  $('#nav').style.display='none';
  $('#app').innerHTML='<div class="empty">جاري التحميل…</div>';
  google.script.run.withSuccessHandler(s=>{
    if(!s.configured)return lockScreen('setup');
    const dt=ls.get('dt');
    if(dt&&ls.get('fp'))return lockScreen('login',true);
    if(dt){TOKEN=dt;$('#nav').style.display='';return load()}
    lockScreen('login');
  }).withFailureHandler(e=>{$('#app').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}).status();
}
function lockScreen(mode,tryFp){
  closeSheet();TOKEN=null;$('#app').innerHTML='';$('#nav').style.display='none';
  const L=$('#lock'),fp=ls.get('fp')&&ls.get('dt');
  L.style.display='flex';
  L.innerHTML=mode==='setup'?`<div class="lk"><h2>إنشاء الحماية</h2><small style="color:var(--mut)">أول مرة بس. اختار يوزر وباسورد.</small>
   <label>اليوزر (حروف أو أرقام من غير مسافات)</label><input id="l_u" autocomplete="username">
   <label>الباسورد (6 حروف على الأقل)</label><input id="l_p" type="password" autocomplete="new-password">
   <label>أكد الباسورد</label><input id="l_p2" type="password">
   <label class="chk"><input id="l_r" type="checkbox" checked> افتكرني على الموبايل ده</label>
   <button class="btn" onclick="doSetup()">إنشاء ودخول</button></div>`
  :`<div class="lk"><h2>مصاريفي 🔒</h2>
   ${fp?'<button class="btn" style="background:var(--ink);margin-top:10px" onclick="fpUnlock()">👆 فتح بالبصمة</button>':''}
   <label>اليوزر</label><input id="l_u" autocomplete="username">
   <label>الباسورد</label><input id="l_p" type="password" autocomplete="current-password">
   <label class="chk"><input id="l_r" type="checkbox" ${ls.get('dt')?'checked':''}> افتكرني على الموبايل ده</label>
   <button class="btn" ${fp?'style="background:#fff;color:var(--ink);border:1px solid var(--line)"':''} onclick="doLogin()">دخول</button><div style="text-align:center;margin-top:12px"><a onclick="forgotInfo()" style="color:var(--mut);font-size:13px;text-decoration:underline;cursor:pointer">نسيت الباسورد؟</a></div></div>`;
  if(mode==='login'&&tryFp&&fp)fpUnlock();
}
function unlocked(){$('#lock').style.display='none';$('#lock').innerHTML='';$('#nav').style.display='';load()}
function doSetup(){
  const u=val('l_u'),p=val('l_p');
  if(!u||p.length<6)return toast('اليوزر والباسورد (6 حروف+)');
  if(p!==val('l_p2'))return toast('الباسورد مش متطابق');
  toast('جاري الإنشاء…');
  google.script.run.withSuccessHandler(()=>doLogin()).withFailureHandler(e=>toast(e.message)).setup(u,p);
}
function doLogin(){
  const u=val('l_u'),p=val('l_p'),r=$('#l_r').checked;
  if(!u||!p)return toast('اكتب اليوزر والباسورد');
  toast('جاري الدخول…');
  google.script.run.withSuccessHandler(t=>{
    TOKEN=t;if(r)ls.set('dt',t);else{ls.del('dt');ls.del('fp')}
    unlocked();
    if(r&&!ls.get('fp')&&window.PublicKeyCredential)setTimeout(()=>{if(confirm('تفعّل الدخول بالبصمة؟'))enableFp()},800);
  }).withFailureHandler(e=>toast(e.message)).login(u,p,r);
}
async function enableFp(){
  if(!ls.get('dt')){return toast('سجّل دخول مع "افتكرني" الأول')}
  try{
    const c=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:'مصاريفي'},user:{id:rnd(16),name:'me',displayName:'me'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});
    ls.set('fp',b64(c.rawId));toast('البصمة اتفعّلت ✔');
  }catch(e){toast('البصمة مش متاحة هنا، استخدم الباسورد')}
}
async function fpUnlock(){
  try{
    await navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:'public-key',id:unb64(ls.get('fp'))}],userVerification:'required',timeout:60000}});
    TOKEN=ls.get('dt');unlocked();
  }catch(e){toast('البصمة ماشتغلتش، ادخل بالباسورد')}
}
function doLogout(){
  const t=TOKEN;google.script.run.logout(t);
  ls.del('dt');ls.del('fp');lockScreen('login');
}
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();return}
  if(TOKEN&&ls.get('fp')&&ls.get('dt')&&hiddenAt&&Date.now()-hiddenAt>60000)lockScreen('login',true);
});
const TEMPLATE_URL='';
function switchSheet(){askConfirm('ربط شيت تاني؟','هتفصل الشيت الحالي من الموبايل ده. بياناتك في الشيت نفسه مش هتتمسح.','نعم، اربط',()=>{ls.del('api');ls.del('dt');ls.del('fp');API='';location.reload()})}
function askApi(){
  $('#nav').style.display='none';$('#lock').style.display='flex';
  $('#lock').innerHTML=`<div class="lk"><h2>ربط الشيت</h2><small style="color:var(--mut)">الصق لينك الـ Web app (بيخلص بـ /exec). بيتحفظ على الموبايل مرة واحدة.</small>
   <label>لينك Apps Script</label><input id="l_api" dir="ltr" placeholder="https://script.google.com/macros/s/.../exec">
   <button class="btn" onclick="saveApi()">حفظ</button>
   ${TEMPLATE_URL?`<a href="${TEMPLATE_URL}" target="_blank" class="btn" style="display:block;text-align:center;text-decoration:none;background:var(--ink)">📄 معنديش شيت؟ اعمل نسخة جاهزة</a><small style="color:var(--mut);display:block;margin-top:8px">بعد النسخ: Extensions ← Apps Script ← Deploy ← New deployment ← Web app (Execute as: Me • Access: Anyone) وانسخ اللينك.</small>`:''}</div>`;
}
function saveApi(){
  const u=val('l_api').trim();
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u))return toast('اللينك لازم يخلص بـ /exec');
  ls.set('api',u);API=u;$('#lock').style.display='none';boot();
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script>
</body>
</html>
